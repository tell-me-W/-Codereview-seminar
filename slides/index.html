<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Quality Seminar Slides</title>
  <style>
    :root {
      --page: #e8edf3;
      --surface: #ffffff;
      --surface-soft: #f4f5f7;
      --line: #dfe4eb;
      --ink: #333333;
      --muted: #667085;
      --navy: #1e3a5f;
      --navy-soft: #e8eef6;
      --gold: #c8a45c;
      --shadow: 0 20px 54px rgba(30, 58, 95, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(30, 58, 95, 0.08), transparent 28%),
        linear-gradient(315deg, rgba(200, 164, 92, 0.12), transparent 24%),
        var(--page);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
    }

    .hub {
      display: grid;
      grid-template-columns: minmax(270px, 340px) minmax(0, 1fr);
      min-height: 100vh;
      gap: 18px;
      padding: 18px;
    }

    .sidebar,
    .viewer {
      border: 1px solid rgba(30, 58, 95, 0.14);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: clamp(22px, 2.5vw, 34px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 38px;
      height: 3px;
      background: var(--gold);
      content: "";
    }

    h1 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: clamp(28px, 2.5vw, 40px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .sidebar-copy {
      margin: 0 0 clamp(22px, 3vw, 40px);
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    .session {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 14px;
      width: 100%;
      min-height: 92px;
      border: 1px solid var(--line);
      border-left: 4px solid transparent;
      background: var(--surface-soft);
      padding: 18px;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .session:hover,
    .session:focus-visible {
      border-color: rgba(30, 58, 95, 0.3);
      background: var(--surface);
      outline: none;
      transform: translateX(2px);
    }

    .session.active {
      border-color: rgba(30, 58, 95, 0.22);
      border-left-color: var(--gold);
      background: var(--navy-soft);
    }

    .session-number {
      color: var(--gold);
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .session-title {
      display: block;
      color: var(--navy);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .session-subtitle {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .viewer {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      padding: 14px;
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      min-height: 58px;
      border: 1px solid var(--line);
      border-bottom: 0;
      background: linear-gradient(90deg, var(--surface-soft), var(--surface));
      padding: 0 clamp(16px, 2vw, 26px);
      color: var(--navy);
      font-size: clamp(17px, 1.55vw, 24px);
      font-weight: 700;
      letter-spacing: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    @media (max-width: 900px) {
      .hub {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100svh;
        gap: 12px;
        padding: 12px;
      }

      .sidebar {
        padding: 18px;
      }

      .sidebar-copy {
        margin-bottom: 16px;
      }

      nav {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .session {
        grid-template-columns: 1fr;
        min-height: 112px;
        gap: 8px;
        padding: 12px;
      }

      .session:hover,
      .session:focus-visible {
        transform: none;
      }

      .session-title {
        font-size: 15px;
      }

      .session-subtitle {
        display: none;
      }

      .viewer {
        min-height: 68svh;
        padding: 10px;
      }
    }

    @media (max-width: 560px) {
      nav {
        grid-template-columns: 1fr;
      }

      .session {
        grid-template-columns: auto minmax(0, 1fr);
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="hub">
    <aside class="sidebar">
      <p class="eyebrow">Code Quality Seminar</p>
      <h1>세션 목차</h1>
      <p class="sidebar-copy">세션을 고르면 오른쪽에서 기존 발표 슬라이드를 그대로 볼 수 있습니다.</p>
      <nav aria-label="Seminar sessions">
        <button
          type="button"
          class="session active"
          data-src="junit-testcode-and-jacoco.html"
          data-title="JUnit Test Code와 JaCoCo">
          <span class="session-number">01</span>
          <span>
            <span class="session-title">JUnit Test Code와 JaCoCo</span>
            <span class="session-subtitle">테스트 안전망과 커버리지</span>
          </span>
        </button>
        <button
          type="button"
          class="session"
          data-src="testable-code-solid-legacy-refactoring.html"
          data-title="테스트하기 쉬운 코드: SOLID와 레거시 리팩토링">
          <span class="session-number">02</span>
          <span>
            <span class="session-title">테스트하기 쉬운 코드</span>
            <span class="session-subtitle">SOLID와 레거시 리팩토링</span>
          </span>
        </button>
        <button
          type="button"
          class="session"
          data-src="design-patterns-for-changeable-code.html"
          data-title="디자인 패턴: 변경에 강한 코드를 만드는 반복 해법">
          <span class="session-number">03</span>
          <span>
            <span class="session-title">디자인 패턴</span>
            <span class="session-subtitle">변경 문제의 반복 해법</span>
          </span>
        </button>
        <button
          type="button"
          class="session"
          data-src="code-smells.html"
          data-title="코드 스멜: 리팩토링이 필요한 신호를 읽는 법">
          <span class="session-number">04</span>
          <span>
            <span class="session-title">코드 스멜</span>
            <span class="session-subtitle">리팩토링이 필요한 신호를 읽는 법</span>
          </span>
        </button>
      </nav>
    </aside>

    <section class="viewer" aria-live="polite">
      <div class="viewer-bar" id="viewer-title">JUnit Test Code와 JaCoCo</div>
      <iframe
        id="slide-frame"
        title="JUnit Test Code와 JaCoCo"
        src="junit-testcode-and-jacoco.html"></iframe>
    </section>
  </main>

  <script>
    const frame = document.getElementById('slide-frame');
    const viewerTitle = document.getElementById('viewer-title');
    const sessions = [...document.querySelectorAll('.session')];

    function selectSession(button) {
      sessions.forEach((session) => session.classList.toggle('active', session === button));
      frame.src = button.dataset.src;
      frame.title = button.dataset.title;
      viewerTitle.textContent = button.dataset.title;
    }

    sessions.forEach((button) => {
      button.addEventListener('click', () => selectSession(button));
    });
  </script>
</body>
</html>
